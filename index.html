<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku Solver</title>
<style>
:root{--bg:#f3f6f4;--ink:#1d2b26;--line:#9fb3aa;--thick:#1d2b26;--cell:#fff;--given:#1d2b26;--solved:#1f7a5c;--btn:#1f7a5c;--btnink:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121a17;--ink:#e6efeb;--line:#3d5249;--thick:#8fb3a3;--cell:#1a2420;--given:#e6efeb;--solved:#5fd0a5;--btn:#5fd0a5;--btnink:#0b1511;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;padding:20px 12px 40px}
main{width:100%;max-width:440px}
h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 18px;font-family:system-ui,sans-serif;font-size:.92rem;opacity:.8;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid var(--thick);background:var(--cell);aspect-ratio:1}
.grid input{width:100%;height:100%;min-width:0;border:1px solid var(--line);background:var(--cell);color:var(--given);text-align:center;font:600 clamp(1rem,5.5vw,1.6rem) Georgia,serif;padding:0;border-radius:0;caret-color:var(--btn)}
.grid input:focus{outline:2px solid var(--btn);outline-offset:-2px;position:relative}
.grid input.solved{color:var(--solved);font-weight:400}
.grid input:nth-child(3n){border-right:3px solid var(--thick)}
.grid input:nth-child(9n){border-right:1px solid var(--line)}
.grid input:nth-child(n+19):nth-child(-n+27),.grid input:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid var(--thick)}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{font:600 1rem system-ui,sans-serif;padding:12px 18px;border-radius:8px;border:2px solid var(--btn);cursor:pointer;background:transparent;color:var(--btn)}
button.primary{background:var(--btn);color:var(--btnink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{margin-top:14px;font-family:system-ui,sans-serif;font-size:.95rem;min-height:1.4em}
#msg.err{color:var(--err)}
footer{margin-top:26px;font-family:system-ui,sans-serif;font-size:.85rem;opacity:.75;line-height:1.5}
a{color:var(--btn)}
</style>
</head>
<body>
<main>
<h1>Sudoku Solver</h1>
<p class="sub">Type the numbers you know, leave the rest empty, then press Solve. Or load the sample puzzle.</p>
<div class="grid" id="grid" role="group" aria-label="Sudoku grid"></div>
<div class="row">
<button class="primary" id="solve">Solve</button>
<button id="sample">Load sample</button>
<button id="clear">Clear</button>
</div>
<div id="msg" role="status"></div>
<footer>Built with C++ first (backtracking, bitmasks, MRV), then ported to JavaScript so it runs in the browser. <a href="https://github.com/khushi1849/sudoku-solver">View the code on GitHub</a>.</footer>
</main>
<script>
const grid=document.getElementById('grid'),msg=document.getElementById('msg');
const cells=[];
for(let i=0;i<81;i++){
  const el=document.createElement('input');
  el.inputMode='numeric';el.maxLength=1;el.setAttribute('aria-label','Row '+(Math.floor(i/9)+1)+' column '+(i%9+1));
  el.addEventListener('input',()=>{el.value=el.value.replace(/[^1-9]/g,'');el.classList.remove('solved');});
  el.addEventListener('keydown',e=>{
    const m={ArrowRight:1,ArrowLeft:-1,ArrowDown:9,ArrowUp:-9}[e.key];
    if(m){const n=i+m;if(n>=0&&n<81){cells[n].focus();e.preventDefault();}}
  });
  grid.appendChild(el);cells.push(el);
}
function say(t,err){msg.textContent=t;msg.className=err?'err':'';}
function read(){return cells.map(c=>c.value?+c.value:0);}

function solve(g){
  const row=Array(9).fill(0),col=Array(9).fill(0),box=Array(9).fill(0);
  for(let i=0;i<81;i++){
    const v=g[i];if(!v)continue;
    const r=(i/9)|0,c=i%9,b=((r/3)|0)*3+((c/3)|0),bit=1<<v;
    if((row[r]|col[c]|box[b])&bit)return false;
    row[r]|=bit;col[c]|=bit;box[b]|=bit;
  }
  function go(){
    let best=-1,bestMask=0,bestCnt=10;
    for(let i=0;i<81;i++){
      if(g[i])continue;
      const r=(i/9)|0,c=i%9,b=((r/3)|0)*3+((c/3)|0);
      const free=~(row[r]|col[c]|box[b])&0x3FE;
      let cnt=0;for(let m=free;m;m&=m-1)cnt++;
      if(cnt<bestCnt){bestCnt=cnt;best=i;bestMask=free;if(cnt<=1)break;}
    }
    if(best<0)return true;
    if(bestCnt===0)return false;
    const r=(best/9)|0,c=best%9,b=((r/3)|0)*3+((c/3)|0);
    for(let v=1;v<=9;v++){
      const bit=1<<v;if(!(bestMask&bit))continue;
      g[best]=v;row[r]|=bit;col[c]|=bit;box[b]|=bit;
      if(go())return true;
      g[best]=0;row[r]&=~bit;col[c]&=~bit;box[b]&=~bit;
    }
    return false;
  }
  return go();
}

document.getElementById('solve').onclick=()=>{
  const start=read(),g=start.slice();
  if(start.every(v=>v===0)){say('Enter some numbers first, or load the sample.',true);return;}
  const t=performance.now();
  const ok=solve(g);
  const ms=(performance.now()-t).toFixed(2);
  if(!ok){say('No solution. Check the numbers you entered for repeats in a row, column or box.',true);return;}
  g.forEach((v,i)=>{cells[i].value=v;cells[i].classList.toggle('solved',!start[i]);});
  say('Solved in '+ms+' ms.');
};
document.getElementById('clear').onclick=()=>{cells.forEach(c=>{c.value='';c.classList.remove('solved');});say('');};
document.getElementById('sample').onclick=()=>{
  const s='8........'+'..36.....'+'.7..9.2..'+'.5...7...'+'....457..'+'...1...3.'+'..1....68'+'..85...1.'+'.9....4..';
  cells.forEach((c,i)=>{c.value=s[i]==='.'?'':s[i];c.classList.remove('solved');});
  say('Sample loaded. Press Solve.');
};
</script>
</body>
</html>
